# 项目级 detekt 配置,继承默认规则集(buildUponDefaultConfig = true)。
# 调整项:
# - FunctionNaming:排除 @Composable 注解的函数,Compose 官方用 PascalCase
# - ForbiddenComment:允许 TODO / FIXME / NOTE 等开发注释关键字
# - TooManyFunctions:时间线 ViewModel 聚合多选与图像操作,函数数超默认 11
# - LongParameterList:排除 @Composable(回调式签名参数多属官方惯例)

build:
  maxIssues: 0           # 阶段 0 要求 0 issue(全警告视为错误)
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 0

config:
  validation: true        # 配置有效性检查
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    # 排除 @Composable 注解的函数:Compose 官方惯例 PascalCase
    # (如 PixcaseTheme / PlaceholderScreen / TimelinePlaceholder)
    ignoreAnnotated: ['Composable']

style:
  ForbiddenComment:
    active: false  # detekt 1.23 默认禁止 TODO/FIXME/STOPSHIP;阶段 0-1 累积技术债时常出现,
                   # 项目级禁用该规则,后续阶段收敛技术债后再单独启用

# 阶段 2 起时间线 ViewModel 同时承载分页状态、多选状态与图像操作编排,函数数
# 超出默认 11;30 的上限覆盖阶段 2/3 全部操作编排。
complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 30
    thresholdInFiles: 22
    thresholdInInterfaces: 22
    thresholdInObjects: 22
  LongParameterList:
    # Compose 的回调式签名(items + 状态 + 若干回调 + modifier)参数多属官方惯例,
    # 不按普通函数的参数个数上限报警
    ignoreAnnotated: ['Composable']

# 项目级 excludes(本项目暂不配置,需要时按 detekt pathFilter 语法添加)
# excludes: '**/generated/**,**/build/**'
